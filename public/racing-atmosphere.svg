  <radialGradient id="vignette" cx="50%" cy="46%" r="72%"><stop offset="0" stop-color="#050607" stop-opacity="0"/><stop offset=".72" stop-color="#050607" stop-opacity="0"/><stop offset="1" stop-color="#020203" stop-opacity=".62"/></radialGradient>
  <filter id="blur60"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="blur34"><feGaussianBlur stdDeviation="34"/></filter>
  <filter id="blur12"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .05"/></feComponentTransfer></filter>
