<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" preserveAspectRatio="xMidYMid slice">
<defs>
  <radialGradient id="halo" cx="76%" cy="32%" r="46%"><stop offset="0" stop-color="#ff272d" stop-opacity=".58"/><stop offset=".22" stop-color="#c8090f" stop-opacity=".32"/><stop offset=".5" stop-color="#560005" stop-opacity=".12"/><stop offset="1" stop-color="#050607" stop-opacity="0"/></radialGradient>
  <radialGradient id="shoulder" cx="66%" cy="70%" r="42%"><stop offset="0" stop-color="#9a070c" stop-opacity=".16"/><stop offset=".55" stop-color="#3a0003" stop-opacity=".06"/><stop offset="1" stop-color="#050607" stop-opacity="0"/></radialGradient>
  <linearGradient id="flare" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#ff2028" stop-opacity="0"/>
    <stop offset=".42" stop-color="#e21620" stop-opacity=".22"/>
    <stop offset=".56" stop-color="#ff9a96" stop-opacity=".5"/>
    <stop offset=".7" stop-color="#c40e14" stop-opacity=".18"/>
    <stop offset="1" stop-color="#ff2028" stop-opacity="0"/>
