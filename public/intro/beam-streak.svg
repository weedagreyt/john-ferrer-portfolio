<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 1400" preserveAspectRatio="none">
<defs>
  <filter id="bsCore" x="-100%" y="-20%" width="300%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.004 0.012" numOctaves="3" seed="21" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur in="d" stdDeviation="1.4"/>
  </filter>
  <filter id="bsMed" x="-150%" y="-20%" width="400%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.004 0.012" numOctaves="3" seed="21" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur in="d" stdDeviation="12"/>
  </filter>
  <filter id="bsWide" x="-200%" y="-30%" width="500%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.004 0.012" numOctaves="3" seed="21" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="40" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur in="d" stdDeviation="30"/>
  </filter>
  <filter id="bsGrain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .07"/></feComponentTransfer>
  </filter>
  <linearGradient id="bsFill" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff2027" stop-opacity="0"/>
    <stop offset=".5" stop-color="#ff3339" stop-opacity=".95"/>
    <stop offset="1" stop-color="#ff2027" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="bsFade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".12" stop-color="#fff" stop-opacity="1"/>
    <stop offset=".88" stop-color="#fff" stop-opacity="1"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <mask id="bsMask"><rect x="0" y="0" width="240" height="1400" fill="url(#bsFade)"/></mask>
</defs>

<g mask="url(#bsMask)">
  <rect x="60" y="0" width="120" height="1400" fill="url(#bsFill)" filter="url(#bsWide)" opacity=".65"/>
  <rect x="80" y="0" width="80" height="1400" fill="url(#bsFill)" filter="url(#bsMed)" opacity=".8"/>
  <rect x="110" y="0" width="20" height="1400" fill="#fff2f0" filter="url(#bsCore)" opacity=".95"/>
  <rect x="60" y="0" width="120" height="1400" filter="url(#bsGrain)" opacity=".5"/>
</g>
</svg>
