<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 1400" preserveAspectRatio="none">
<defs>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".12" stop-color="#fff" stop-opacity="1"/>
    <stop offset=".88" stop-color="#fff" stop-opacity="1"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <mask id="fadeMask"><rect width="240" height="1400" fill="url(#fade)"/></mask>

  <linearGradient id="bloomGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff2027" stop-opacity="0"/>
    <stop offset=".5" stop-color="#ff2027" stop-opacity=".92"/>
    <stop offset="1" stop-color="#ff2027" stop-opacity="0"/>
  </linearGradient>

  <filter id="blurWide" x="-150%" y="-5%" width="400%" height="110%"><feGaussianBlur stdDeviation="20"/></filter>
  <filter id="blurMed" x="-150%" y="-5%" width="400%" height="110%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="blurCore" x="-150%" y="-5%" width="400%" height="110%"><feGaussianBlur stdDeviation="1.1"/></filter>
  <filter id="blurGlint" x="-400%" y="-400%" width="900%" height="900%"><feGaussianBlur stdDeviation="3.2"/></filter>

  <pattern id="metal" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
    <line x1="0" y1="0" x2="0" y2="7" stroke="#ffffff" stroke-opacity=".07" stroke-width="1"/>
  </pattern>
</defs>

<g mask="url(#fadeMask)">
  <rect x="34" y="0" width="9" height="1400" fill="url(#bloomGrad)" opacity=".28" filter="url(#blurWide)"/>
  <rect x="190" y="0" width="7" height="1400" fill="url(#bloomGrad)" opacity=".24" filter="url(#blurWide)"/>

  <rect x="88" y="0" width="64" height="1400" fill="url(#bloomGrad)" opacity=".85" filter="url(#blurWide)"/>
  <rect x="103" y="0" width="34" height="1400" fill="url(#bloomGrad)" opacity=".95" filter="url(#blurMed)"/>
  <rect x="88" y="0" width="64" height="1400" fill="url(#metal)" opacity=".55"/>
  <rect x="117" y="0" width="6" height="1400" fill="#fff3f1" filter="url(#blurCore)"/>

  <g transform="translate(120,830)">
    <circle r="26" fill="#ff3d3d" opacity=".5" filter="url(#blurWide)"/>
    <circle r="5" fill="#fff8f6" filter="url(#blurGlint)"/>
    <rect x="-1.1" y="-92" width="2.2" height="184" fill="#fff3f1" opacity=".92" filter="url(#blurGlint)"/>
    <rect x="-40" y="-1.1" width="80" height="2.2" fill="#fff3f1" opacity=".55" filter="url(#blurGlint)"/>
  </g>
</g>
</svg>
