name: Final Rendered QA

on:
  push:
    branches: [audit/final-rendered-qa-2026-09-09]

permissions:
  contents: read

jobs:
  rendered-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Save tested production lockfile
        run: cp package-lock.json /tmp/site-package-lock.json
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run production server and browser QA
        run: |
          npm start > /tmp/portfolio-server.log 2>&1 &
          echo $! > /tmp/portfolio-server.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000 >/dev/null
          node scripts/final-rendered-qa-v2.mjs
      - name: Preserve tested production lockfile
        if: always()
        run: |
          mkdir -p qa-output
          cp /tmp/site-package-lock.json qa-output/package-lock.json
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/portfolio-server.log || true
      - name: Upload rendered QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-rendered-qa
          path: qa-output
          if-no-files-found: warn
          retention-days: 3
